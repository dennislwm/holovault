name: holovault
description: A Flutter iOS app for importing and browsing TCG collection data (CSV/JSON).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_form_builder: ^10.3.0
  file_picker: ^11.0.3
  csv: ^8.0.0
  json_schema: ^5.2.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  local_query_filter: ^1.0.0
  flex_color_scheme: ^8.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
